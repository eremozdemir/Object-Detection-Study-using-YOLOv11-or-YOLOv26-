# VisDrone2019-DET dataset configuration for Ultralytics YOLO
# Annotation format after conversion: YOLO (class cx cy w h, normalised 0-1)
#
# VisDrone original classes (1-indexed, 0 = ignored, 11 = others — both skipped):
#   1:pedestrian  2:people  3:bicycle  4:car  5:van
#   6:truck  7:tricycle  8:awning-tricycle  9:bus  10:motor
# Mapped to YOLO 0-indexed (10 classes total):

path: ../Data          # dataset root — relative to this config file

train: VisDrone2019-DET-train/images
val:   VisDrone2019-DET-val/images
test:  VisDrone2019-DET-test-dev/images

# Number of classes
nc: 10

# Class names (0-indexed, matching convert_visdrone_to_yolo.py mapping)
names:
  0: pedestrian
  1: people
  2: bicycle
  3: car
  4: van
  5: truck
  6: tricycle
  7: awning-tricycle
  8: bus
  9: motor
